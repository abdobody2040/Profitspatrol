services:
  # 1. Grafana Loki - Central Log Store
  loki:
    image: grafana/loki:3.0.0
    container_name: profitspatrol_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ./loki/alert-rules.yaml:/loki/rules/profitspatrol/alert-rules.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logging_net

  # 2. Vector - High-Performance Collector & Log Shipper with Disk Buffering
  vector:
    image: timberio/vector:0.38.0-alpine
    container_name: profitspatrol_vector
    restart: unless-stopped
    ports:
      - "8088:8088" # HTTP log ingest
      - "8686:8686" # Vector API / health
    environment:
      - APP_ENV=${APP_ENV:-production}
      - LOKI_ENDPOINT=http://loki:3100
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector_buffer:/var/lib/vector
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - logging_net

  # 3. Grafana - Visualization & Dashboards
  grafana:
    image: grafana/grafana:11.0.0
    container_name: profitspatrol_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-profitspatrol2026}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - logging_net

volumes:
  loki_data:
    driver: local
  vector_buffer:
    driver: local
  grafana_data:
    driver: local

networks:
  logging_net:
    driver: bridge
