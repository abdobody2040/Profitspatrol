apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
      derivedFields:
        # Clickable trace correlation link
        - datasourceUid: tempo
          matcherRegex: "trace_id\":\"([a-f0-9]+)\""
          name: TraceID
          url: "$${__value.raw}"
        # Direct request_id filter link
        - matcherRegex: "request_id\":\"([a-f0-9\\-]+)\""
          name: RequestID
          url: "/d/profitspatrol-logs/profitspatrol-logging-analytics?var-request_id=$${__value.raw}"
