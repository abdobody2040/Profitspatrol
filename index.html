<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <script>
    (function() {
      try {
        var lang = localStorage.getItem('app_language') || 'ar';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    })();
  </script>
  <meta name="description"
    content="Profits Patrol: The gamified business education platform for kids. Learn entrepreneurship, earn rewards, and build your empire!" />
  <meta name="theme-color" content="#FFC800" />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Profits Patrol - Future CEO Academy" />
  <meta property="og:description"
    content="The gamified business education platform for kids. Learn entrepreneurship, earn rewards, and build your empire!" />
  <meta property="og:image" content="/pwa-512x512.png" />

  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.profitspatrol.com https://*.profitspatrol.com http://localhost:8000 http://127.0.0.1:8000 https://openrouter.ai https://*.supabase.co wss://*.supabase.co https://generativelanguage.googleapis.com https://api.stripe.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' https://assets.mixkit.co blob:; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://accounts.google.com;" />

  <!-- Critical Resource Preloads (LCP Image & Primary Font) -->
  <link rel="preload" as="image" href="/images/hero/ollie-hero.webp" type="image/webp" fetchpriority="high" />
  <link rel="preload" href="/fonts/nunito-700-normal-24.woff2" as="font" type="font/woff2" crossorigin />

  <title>Profits Patrol - Future CEO Academy</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Profits Patrol" />
  <link rel="manifest" href="/favicon/site.webmanifest" />

  <!-- Self-Hosted Fonts: Zero external DNS / connection overhead -->
  <link rel="stylesheet" href="/fonts/fonts.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      overflow-x: hidden;
    }

    #root {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: #f0fdf4;
      /* Light green bg */
    }

    .dark body {
      background-color: #111827;
      /* gray-900 */
    }

    /* RTL Font Override */
    html[lang="ar"] body {
      font-family: 'Cairo', sans-serif;
    }

    /* Juicy Button Effect */
    .btn-juicy {
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn-juicy:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 0;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/app/main.tsx"></script>
</body>

</html>
